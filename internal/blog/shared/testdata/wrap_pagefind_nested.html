<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blog</title>
    <link rel="canonical" href="https://docs.example.com/blog/">
    <link rel="stylesheet" href="../_chrome/minimal-abcdef012345.css">
<link href="../pagefind/pagefind-ui.css" rel="stylesheet">
<script src="../pagefind/pagefind-ui.js"></script>
</head>
<body>
<div class="shared-page">
<p>x</p>
</div>
<footer class="site-footer">
<p>Built with <a href="https://github.com/stricttools/selfdoc">selfdoc</a></p>
</footer>
<dialog class="search-dialog" id="search-dialog" aria-label="Search documentation">
<div class="search-inner">
<div class="search-header">
<span class="search-header-title">Search</span>
<button class="search-close" aria-label="Close search" type="button">X</button>
</div>
<div id="pagefind-container"></div>
</div>
</dialog>
<script>
document.addEventListener("DOMContentLoaded", function() {
  new PagefindUI({ element: "#pagefind-container", showSubResults: true, showImages: false });
  var dialog = document.getElementById("search-dialog");
  function openSearch() {
    if (dialog.open) return;
    dialog.showModal();
    var input = dialog.querySelector(".pagefind-ui__search-input");
    if (input) input.focus();
  }
  var triggers = document.querySelectorAll(".search-trigger, .search-bar-trigger");
  for (var i = 0; i < triggers.length; i++) {
    triggers[i].addEventListener("click", openSearch);
  }
  document.addEventListener("keydown", function(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "k") {
      e.preventDefault();
      if (dialog.open) { dialog.close(); } else {
        dialog.showModal();
        var input = dialog.querySelector(".pagefind-ui__search-input");
        if (input) input.focus();
      }
    }
    if (e.key === "Escape" && dialog.open) { dialog.close(); }
  });
  var closeBtn = dialog.querySelector(".search-close");
  if (closeBtn) closeBtn.addEventListener("click", function() { dialog.close(); });
  dialog.addEventListener("click", function(e) {
    if (e.target === dialog) dialog.close();
  });
});
</script>
</body>
</html>
