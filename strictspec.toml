# strictspec manifest -- the Go boundary validators for selfdoc's declarative
# documents, one [[schemas]] entry each.
#
# Regenerate with: strictspec gen   (run from the repository root)
# `strictspec check` verifies schema authoring validity and generated-code
# freshness. The generated validators are committed and read-only (chmod 444);
# never edit one by hand -- edit the schema under .strictspec/ and rerun gen.
#
# Each validator is generated INTO the package that loads the document it
# governs, so the embedded document, its validator and its loader sit together
# and nothing else can bind an unvalidated document. The two vocabulary
# documents are the exception: the generator emits the same package-level
# identifiers for every schema, so two validators cannot share a package, and
# each sits in its own subpackage of internal/vocabulary, which loads both.
format_version = 1

[[schemas]]
path = ".strictspec/directive-descriptor.schema.toml"

  [[schemas.targets]]
  lang    = "go"
  output  = "internal/catalog/selfdoc_directive_catalogue_gen.go"
  package = "catalog"

[[schemas]]
path = ".strictspec/lint-registry.schema.toml"

  [[schemas.targets]]
  lang    = "go"
  output  = "internal/lints/selfdoc_lint_registry_gen.go"
  package = "lints"

[[schemas]]
path = ".strictspec/frontmatter.schema.toml"

  [[schemas.targets]]
  lang    = "go"
  output  = "internal/util/selfdoc_frontmatter_gen.go"
  package = "util"

[[schemas]]
path = ".strictspec/directory-manifest.schema.toml"

  [[schemas.targets]]
  lang    = "go"
  output  = "internal/layout/selfdoc_directory_manifest_gen.go"
  package = "layout"

[[schemas]]
path = ".strictspec/vocabulary-terms.schema.toml"

  [[schemas.targets]]
  lang    = "go"
  output  = "internal/vocabulary/termsschema/selfdoc_vocabulary_terms_gen.go"
  package = "termsschema"

[[schemas]]
path = ".strictspec/vocabulary-review.schema.toml"

  [[schemas.targets]]
  lang    = "go"
  output  = "internal/vocabulary/reviewschema/selfdoc_vocabulary_review_gen.go"
  package = "reviewschema"
