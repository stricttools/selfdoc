# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, or major
bump = "minor"
# Short description of this release (required)
description = "ref+target single-symbol rendering, Go dotted method names, expanded CLI help texts."
# Optional context explaining why these changes were made
context = "ref directives now respect the target attribute across all 9 extractors, rendering a single symbol instead of the entire module. This makes PARAM001/RETURN001 checks reachable for targeted documentation. Go public_symbols returns Type.Method for methods, fixing collision bugs. CLI help texts expanded across selfdoc, rlsbl, safegit, and wesktop to satisfy CLI002."
include = ["npm", "pypi"]
exclude = []
release_commit = "397e527dff86a4e8c8dc26e54fc638ba8d58dda5"

[released_trees]
selfdoc = "a88c8373b2afdcb74d3e48ab211765943eab0b16"
