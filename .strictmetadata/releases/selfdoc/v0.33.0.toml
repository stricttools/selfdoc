# never existed. description/context/bump recovered from the GitHub Release
# notes for v0.33.0; include/exclude mirror v0.36.0.toml (not recoverable).
# strictspec document version gate (do not remove)
format_version = 2
bump = "minor"
include = ["npm", "pypi"]
exclude = []
description = "table-commands discovers the strictcli schema automatically (path attribute removed; schema-dir disambiguates multi-schema repos)"
context = "Phase 9.5 coordinated breaking release. table-commands no longer accepts a path attribute; it auto-discovers the unique .strictcli/schema.json by walking the project root, with an optional schema-dir attribute to disambiguate repos that carry more than one schema. Directive attribute handling is now strict across gen and check: an unknown or missing attribute is a hard error (exit 1) reporting the file, line, directive, and allowed attributes.\n\nBecause table-commands path removal is a breaking directive change, all in-tree docs and the eight external consumer repositories that use table-commands were migrated to the new bare-directive syntax in lockstep before this release, so no consumer is left on a directive that would now hard-error."
release_commit = "57798a2d47b4e14a69752f1a28865fa0374178cc"

