# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, or major
bump = "minor"
# Short description of this release (required)
description = "Five new language extractors (Swift, Kotlin, Svelte, Dart, SQL), version_source config, and doc quality checks."
# Optional context explaining why these changes were made
context = """
This release adds five new language extractors: Swift (doc comments, struct schemas, public symbol detection), \
Kotlin (KDoc parsing), Svelte (component props, instance/module exports, JSDoc), \
Dart (class/mixin modifiers, doc comments, part file following, export following with show/hide combinators), \
and SQL (PostgreSQL DDL -- CREATE TABLE/VIEW/TYPE/FUNCTION and COMMENT ON). \
It also introduces the version_source config field for reading the project version from the primary manifest, \
and four new doc quality lint checks: XREF001 (internal page link validation), XREF002 (directive path validation), \
DQ001 (description restates symbol name), DQ002 (description too short), and DQ003 (function-referencing pages need substantive descriptions). \
Several base extractor utilities were refactored into shared helpers to reduce duplication across extractors."""
include = ["npm", "pypi"]
exclude = []
release_commit = "62d39e48d1cc3f0d05cd6d97d904645eb40041e4"

[released_trees]
selfdoc = "612d430d7d6fe1d6b9f360a5d9065b7226b04f10"
