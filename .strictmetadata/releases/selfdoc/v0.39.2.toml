# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, major, infra, or prerelease
#   prerelease: advance an existing pre-release (0.6.0-beta.0 -> -beta.1)
bump = "patch"
# Short description of this release (required)
description = "Latest strictcli, strictspec and go-toml-edit; the deploy workflow pins the released version"
# Optional context explaining why these changes were made
context = """
go-toml-edit was held at 0.3.0 only because the published strictcli/go and
strictspec/go did not compile against 0.4.0; both now do, so all three move
together. internal/util's TOML decode no longer walks the AST to work around
the 0.3.0 decoder dropping an array of tables nested inside another one -- the
0.4.0 read-layer answers that shape correctly, and only document key order,
which is a question about how the file was written, still comes off the AST.

The post-release hook's missing pin was found on the 0.39.1 release: it wrote
an assembly deploy workflow pinned to 0.39.0 because the selfdoc on PATH at
hook time predated the version bump.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). With patch/minor/major it ENTERS the
# channel (0.5.2 + minor + alpha -> 0.6.0-alpha.0); with
# bump = "prerelease" it promotes, and "stable" strips the
# suffix. See docs/release-workflow.md#the-pre-release-channel.
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["go"]
exclude = []
release_commit = "27cfd802d8ef9adf9cdd88e57479f16b098998d6"

[released_trees]
"." = "792f26f8cd6b3098e21605d6e26d7578bf94488a"
