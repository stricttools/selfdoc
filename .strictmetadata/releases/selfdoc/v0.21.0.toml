# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, or major
bump = "minor"
# Short description of this release (required)
description = "Posts system, page types, unversioned pages, deployment topology, assembly infrastructure, Pagefind search, and shared elements for multi-project documentation sites."
# Optional context explaining why these changes were made
context = "This release introduces a complete blog/posts system integrated with rlsbl releases, a page type system with configurable schema.org mappings and per-type layouts, unversioned pages for content that persists across doc versions, a deployment topology config for multi-project unified sites, an assembly system that manages a throwaway GitHub repo for aggregated documentation deployment to Cloudflare Pages, Pagefind as a new search engine option with chunked indexes and filtering, and shared elements generation (homepage, blog index, nav, feeds, sitemap) for assembled sites."
# Set to true to generate a blog post for this release
# blog = false
include = ["npm", "pypi"]
