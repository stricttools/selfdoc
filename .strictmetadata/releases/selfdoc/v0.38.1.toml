# Archived by rlsbl at release time. This release had no unreleased.toml
# (a batch member takes its metadata from the batch release file); the
# archive is written so later changelog regenerations keep the
# description and context.
# strictspec document version gate (do not remove)
format_version = 2
bump = "patch"
include = ["npm", "pypi"]
exclude = []
description = "Fixes the CLI reference pages selfdoc generates failing selfdoc's own spell check: the entity indent on a scoped flag row and the 'Clearable' heading of a sparse update."
context = "selfdoc renders a strictcli app's schema into reference pages and then\nspell-checks those pages, so every fixed word and every markup construct the\nrenderer emits is judged by SPELL001 in the consumer's project. Two of them\nwere not words the engine knew: the '&nbsp;' entity that indents a scoped\nflag's row under the member it belongs to, and the '- Clearable:' heading a\nsparse update publishes its unset tokens under. The first project to render a\nmember-spelled selector and an update command with a nullable property got 37\nerror-severity lints for text it did not write and could not edit.\n\nBoth are fixed in the engine (selfdoc-core 0.10.1), each at the layer it\nbelongs to: entity references are markup and are blanked like tags before a\nline is scanned, and the fixed vocabulary selfdoc's own renderers emit is\ncarried by the engine and accepted everywhere, because the accept list belongs\nto one machine while a rendered page ships to all of them. A rendered-page test\nrenders a schema exercising every construct the renderer has prose for, so a\nnew fixed word cannot reach a consumer unaccepted."
release_commit = "578771902a1d9e11c8bf1b261af804f313a5f627"

[released_trees]
selfdoc = "aaf2594f028e4b1ab56a80d790fcf51396ace420"
