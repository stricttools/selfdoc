# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, major, infra, or prerelease
#   prerelease: advance an existing pre-release (0.6.0-beta.0 -> -beta.1)
bump = "patch"
# Short description of this release (required)
description = "Install with go install github.com/smm-h/selfdoc@v0"
# Optional context explaining why these changes were made
context = "The binary's package main moved from cmd/selfdoc to the module root, so the install line loses its trailing path segment and the binary still takes its name from the module's last element. Nothing under internal/ can import a root package main, so the version is handed down from the entry point instead: internal/cli takes it on Options.Version, and the selfdoc toolchain pin a generated assembly deploy workflow installs is now a required input rather than a value the assembly package reads for itself. This release also carries the already-committed test-speed work, which builds the suites' fake external tools once instead of re-running the race binary for every invocation."
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). With patch/minor/major it ENTERS the
# channel (0.5.2 + minor + alpha -> 0.6.0-alpha.0); with
# bump = "prerelease" it promotes, and "stable" strips the
# suffix. See docs/release-workflow.md#the-pre-release-channel.
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["go"]
exclude = []
release_commit = "5b99f0549dd7dc9f231abf7b59d52166310a6f5b"

[released_trees]
"." = "c157c690faa1913de46f699fda18450be39f2a79"
