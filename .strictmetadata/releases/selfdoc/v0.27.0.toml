# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, major, hotfix, or prerelease
bump = "minor"
# Short description of this release (required)
description = "Three-package architecture (selfdoc_core + selfdoc + selfblog), forced-rewrite staleness, per-language list-modules, post revisions."
# Optional context explaining why these changes were made
context = """
Splits the codebase into three packages: selfdoc_core (shared build engine and extractors), \
selfdoc (CLI and documentation generation), and selfblog (blog assembly and CLI). This sets up \
the future monorepo conversion. Staleness detection gains baseline-hold semantics (baseline \
does not advance while errors remain), schema-hash gating with seeded markers for CLI pages, \
and root-file template validation. The list-modules directive now groups modules by language \
with extractor summaries. Post infrastructure adds a revisions sidecar (content-hash gated \
revision tracking) and localStorage read indicators. Manifest loading uses a tolerant-reader \
contract with centralized compatibility checks for forward-compatible schema evolution."""
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["npm", "pypi"]
exclude = []
release_commit = "537049493a9582d50cd1915d4c74d7ed31224517"

