# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, major, infra, or prerelease
#   prerelease: advance an existing pre-release (0.6.0-beta.0 -> -beta.1)
bump = "patch"
# Short description of this release (required)
description = "The assembly commands name the branch they read and write"
# Optional context explaining why these changes were made
context = """
Four call sites passed an empty branch into the GitHub Git Data API helpers,
which renders "/repos/<repo>/git/ref/heads/" and is answered 404. It surfaced
on 0.39.2's own post-release hook: the fix that made the hook pin the deploy
workflow to the released version could not take effect, because the command
doing the pinning never reached the assembly at all. The helpers now refuse an
empty branch by name, so the path can no longer be rendered.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). With patch/minor/major it ENTERS the
# channel (0.5.2 + minor + alpha -> 0.6.0-alpha.0); with
# bump = "prerelease" it promotes, and "stable" strips the
# suffix. See docs/release-workflow.md#the-pre-release-channel.
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["go"]
exclude = []
release_commit = "754601fbcb53ad31f9b65b6eac640dbde6855eec"

[released_trees]
"." = "c250f95529130a5927e966d5c77bc3a21c0b2637"
