# Archived by rlsbl at release time. This release had no unreleased.toml
# (a batch member takes its metadata from the batch release file); the
# archive is written so later changelog regenerations keep the
# description and context.
# strictspec document version gate (do not remove)
format_version = 2
bump = "patch"
include = ["npm", "pypi"]
exclude = []
description = "Fix the unified build's root redirect stub so its hop resolves inside the site subtree."
context = "The unified build carried the same root-relative stub hop as the per-project\nbuild (/<locale>/common/<version>/), which escapes any path prefix the site is\nserved under. The Cloudflare _redirects rule stays site-absolute, because it\nis only ever read at the deployed site root, where there is no document for a\nrelative target to resolve against."
release_commit = "9b0b83e7a4d294eedc4c5d8131a123075fe8fc13"

