# Archived by rlsbl at release time. This release had no unreleased.toml
# (a batch member takes its metadata from the batch release file); the
# archive is written so later changelog regenerations keep the
# description and context.
# strictspec document version gate (do not remove)
format_version = 2
bump = "minor"
include = ["npm", "pypi"]
exclude = []
description = "One canonical blog URL with single-hop redirects, config-driven assembly artifacts requiring three config changes, and the strictcli effects regime with `post publish` and `assembly init` declared consequential"
context = "The blog was reachable at more than one URL, and search engines were being asked to guess which one counted. This release settles it: the retired blog subdomain now 301s straight to the canonical `<docs_base>/blog` in a single hop instead of bouncing through the apex, requests for `/blog` arriving on any other host bound to the same Pages project are redirected too, and the shared homepage and blog index declare `rel=canonical` so a crawler that reaches them by some other route still learns the one address that counts.\n\nThe generated assembly artifacts stopped being hardcoded in the same pass. `assembly generate-shared` now requires `--canonical-base`, and the deploy workflow it generates reads its Cloudflare Pages project from the new required `assembly.pages_project` key -- the same key `assembly init` uses, which is the point: the two disagreed before, so the project init created one name and the generated workflow deployed to another. Three config changes are required; the changelog entry enumerates them.\n\nselfblog also adopts strictcli's effects regime alongside selfdoc, and it is the package where dry-run matters most. A dry `assembly init` now names the GitHub repository it would create, the Pages project it would claim and each secret it would set, and performs none of it. Two commands are declared consequential and prompt before dispatch: `post publish`, the moment locally-authored private content becomes publicly readable, and `assembly init`, which creates three named external resources that a rerun cannot un-create. `assembly push` and `assembly rebuild` are deliberately not consequential -- they re-derive already-public documentation from an already-public tag -- and keep running bare."
release_commit = "72ff3a60ceddea88e2ed0345aa32a67e321239cd"

