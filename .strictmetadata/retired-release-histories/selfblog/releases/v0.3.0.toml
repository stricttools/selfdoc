# Archived by rlsbl at release time. This release had no unreleased.toml
# (a batch member takes its metadata from the batch release file); the
# archive is written so later changelog regenerations keep the
# description and context.
# strictspec document version gate (do not remove)
format_version = 2
bump = "minor"
include = ["npm", "pypi"]
exclude = []
description = "The assembly portfolio page and the unified site's root redirect stub both declare absolute canonical URLs."
context = "selfblog's share of the canonicalization pass. assembly generate-shared now\nsplices a rel=canonical link into the portfolio it copies to the site root,\nand the unified site's root redirect stub emits an absolute canonical instead\nof a root-relative one -- previously every hostname bound to a site claimed to\nbe the canonical one.\n\nThe canonical URL is supplied by a new required --portfolio-canonical flag\n(assembly.portfolio_canonical, templated into the generated deploy workflow).\nSupplying a portfolio file without it is a hard error rather than a silent\ndefault, because the portfolio's canonical is the apex and no other configured\nvalue stands in for it. Callers that pass a portfolio file must add the flag."
release_commit = "60681f6c600fe1df9ea85a9684603b021ee7d4ab"

