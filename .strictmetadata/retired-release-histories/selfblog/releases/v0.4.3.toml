# Archived by rlsbl at release time. This release had no unreleased.toml
# (a batch member takes its metadata from the batch release file); the
# archive is written so later changelog regenerations keep the
# description and context.
# strictspec document version gate (do not remove)
format_version = 2
bump = "patch"
include = ["npm", "pypi"]
exclude = []
description = "Floor the engine at the version that addresses a mount correctly"
context = "selfblog renders every post through selfdoc-core, so a posts-only publish for\na mounted project produced the same dead references the full build did. The\nfloor names selfdoc-core 0.9.2 rather than leaving a consumer to resolve an\nengine that writes them."
release_commit = "dc4895570a87e5702841641ae4118a4def7f5f7b"

[released_trees]
selfblog = "b6d644e6ba2eda00d4eda4ea350483893e92ff37"
