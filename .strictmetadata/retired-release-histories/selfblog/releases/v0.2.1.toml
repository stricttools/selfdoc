# Archived by rlsbl at release time. This release had no unreleased.toml
# (a batch member takes its metadata from the batch release file); the
# archive is written so later changelog regenerations keep the
# description and context.
# strictspec document version gate (do not remove)
format_version = 2
bump = "infra"
include = ["npm", "pypi"]
exclude = []
description = "Republishes 0.2.0's contents, which were tagged but never reached npm or PyPI"
context = "0.2.0 is a phantom. Its tag and GitHub Release exist, but the publish gate refused it and was right to: the tag landed on a commit whose diff touched nothing under `selfblog/`, so the CI router's paths filter skipped selfblog's own test job, and a skipped check proves nothing about the commit it is attached to. The gate would refuse that commit on every re-run, so 0.2.0 can never reach a registry -- there is nothing to retry.\n\nThis release ships the identical code under a number that can publish. Nothing in selfblog changed between the two, which is why the bump type is `infra` and this version's changelog section reads \"no user-facing changes\": everything users care about is written up under 0.2.0, and anyone reading the changelog should read that entry. 0.2.0 is marked deprecated on GitHub and points here.\n\nFixing forward rather than retagging is the deliberate choice. Moving a tag onto a different commit would leave the published artifact and the Release notes describing histories that never matched, and the version number is the cheap thing here."
release_commit = "67f7df054541404bf9ebfb9b35419febb0eeea23"

[released_trees]
selfblog = "04c333fe5beb3213967769fcd65ba4d9caf45137"
