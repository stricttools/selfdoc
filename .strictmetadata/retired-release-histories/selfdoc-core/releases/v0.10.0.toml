# Archived by rlsbl at release time. This release had no unreleased.toml
# (a batch member takes its metadata from the batch release file); the
# archive is written so later changelog regenerations keep the
# description and context.
# strictspec document version gate (do not remove)
format_version = 2
bump = "minor"
include = ["pypi"]
exclude = []
description = "The tinymoon theme becomes the tinymoon framework, glossary terms are declared rather than guessed, and the rendered pages are measured in a real browser"
context = "The rendered-reality suite is what produced most of this release. Six\nuser-visible defects had shipped while every string-level assertion\npassed, so the engine's output is now built for real, served on loopback\nand asserted in a headless browser -- and that is what found the\noverlapping sticky headers, the doubled last-updated line, the unstyled\nshared pages, the dead search button, the table of contents visible only\nin one band of widths and the notice that would not dismiss.\n\nThe tinymoon theme stopped imitating the tinymoon framework and started\ncomposing it, which moved its stylesheet and its fonts and replaced the\nshipped search widget with the framework's own command palette. The\nglossary stopped inventing terms from prose: a term exists where an author\ndeclared one, and nowhere else."
release_commit = "c9da7a36e8ca7e395a29822e0ebb98bc17d55a4c"

