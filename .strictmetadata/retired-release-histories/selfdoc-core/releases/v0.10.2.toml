description = "Published validators regenerated against the current strictspec runtime, so registry installs import again; project-name detection honors the declared source language in polyglot repositories."
context = "The validators shipped in the previous release were generated by strictspec\n0.1.0; strictspec's runtime pairing is an exact version match and floor-only\ndependencies resolve the newest runtime, so every registry install of this\npackage has failed at import since strictspec 0.2.0 shipped. The regenerated\nvalidators and the matching strictspec floor were committed weeks ago and\nnever released; this release ships them."
