# Archived by rlsbl at release time. This release had no unreleased.toml
# (a batch member takes its metadata from the batch release file); the
# archive is written so later changelog regenerations keep the
# description and context.
# strictspec document version gate (do not remove)
format_version = 2
bump = "minor"
include = ["pypi"]
exclude = []
description = "The validate fence marker and the examples config key land in core, and every generated redirect stub now declares an absolute canonical URL."
context = "The core half of the example-validation work: the tokenizer accepts a validate\ntoken in a fenced block's info string, and the config loader accepts a\ntop-level examples key mapping a block language to the validator command\ntemplate (with a {file} placeholder) that selfdoc check substitutes and runs.\n\nThe canonicalization fix is unrelated but ships together. Generated redirect\nstubs -- both the root redirect and the config-driven ones -- emitted a\nroot-relative rel=canonical, which means a site reachable on more than one\nhostname had every alias declaring itself the original. The canonical is now\nbuilt through the project's URL builder, so it is absolute and\ntopology-aware. The new assembly.portfolio_canonical key names the portfolio\npage's canonical explicitly: the portfolio is the site apex, not a docs page,\nso topology.docs_base is the wrong answer and there is deliberately no default."
release_commit = "60681f6c600fe1df9ea85a9684603b021ee7d4ab"

[released_trees]
selfdoc_core = "51fe67c92090c7e845e5fb3de29d7c33679b2eee"
