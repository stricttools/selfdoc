# selfdoc's own vocabulary: the words its documentation uses that the English
# word list and selfdoc's built-in baseline do not carry. Edit it with
# `selfdoc vocabulary`, which keeps each array sorted.
format_version = 1

[[accepted]]
word = "baselined"
meaning = "Recorded in the content and description hash baseline, so a later change is measured against it."

[[accepted]]
word = "canonicals"
meaning = "The canonical links pages declare: the address a search engine treats as a page's own."

[[accepted]]
word = "dirstat"
meaning = "The tool selfdoc quality runs to count a project's source lines."

[[accepted]]
word = "HC"
meaning = "High contrast, as in the high-contrast variants of the built-in themes."

[[accepted]]
word = "mylib"
meaning = "The example Python package the guides' examples document."

[[accepted]]
word = "Plex"
meaning = "IBM Plex, the typeface family the tinymoon theme vendors for prose and data."

[[accepted]]
word = "rlsbl"
meaning = "The release orchestrator that runs selfdoc gen and selfdoc check during a release."

[[accepted]]
word = "safegit"
meaning = "The concurrency-safe git wrapper whose commit command auto-commit uses when rlsbl is absent."

[[accepted]]
word = "strictspec"
meaning = "The schema tool whose generated validators check selfdoc's declarative documents."

[[accepted]]
word = "tinymoon"
meaning = "The theme framework selfdoc's built-in themes are composed with."
